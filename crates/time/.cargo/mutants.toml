# cargo-mutants settings for optimal-time.
#
# Excluded on purpose, with the reason:
# - `replace | with ^` in halted and quiet: each ORs together single-bit
#   masks that cannot overlap (ENABLE and LEGACY_ROUTE are bits 0 and 1;
#   INT_ENB, TYPE, VAL_SET and FSB_EN are bits 2, 3, 6 and 14), and on
#   disjoint bits OR and XOR give the same value, so these mutants are
#   equivalent. The results are pinned bit for bit by hpet::start_hand_worked
#   and config_bits_only_touch_their_own in src/suite.
# - `replace | with ^` in lapic's lvt, dcr and dcr_log2, for the same
#   reason: lvt ORs the vector (bits 0 to 7), the mask (bit 16) and the
#   mode (bits 17 and 18); dcr and dcr_log2 OR bits 0 and 1 with bit 2 or
#   3. Pinned bit for bit by lapic::lvt_hand_worked and
#   dcr_matches_the_sdm_table, and the round-trip properties.
# - `replace | with ^` in level_one_shot: ^ binds tighter than | in Rust,
#   so each mutant XORs two neighbouring terms, and every pair is disjoint:
#   T_ROUTE (bits 9 to 13) and T_32BIT_MODE (bit 8); the configuration with
#   the route field cleared and the new route; the route and T_LEVEL (bit
#   1); T_LEVEL and T_INT_ENABLE (bit 2) or 0. On disjoint bits OR and XOR
#   give the same value, so these mutants are equivalent. Pinned bit for
#   bit by hpet::level_one_shot_hand_worked and level_one_shot_bits.
# - `replace | with ^` in fsb_route, fsb_one_shot, legacy_one_shot and
#   legacy_running, for the same reason: fsb_route joins the address
#   (bits 63:32) and the data (31:0); fsb_one_shot and legacy_one_shot OR
#   T_FSB_ENABLE (bit 14) and T_INT_ENABLE (bit 2) or 0 into a value
#   quiet() has just cleared them in; legacy_running's second | joins
#   ENABLE and LEGACY_ROUTE (bits 0 and 1). (Its first |, against the
#   configuration as read, is not excluded: legacy_hand_worked kills it.)
#   Pinned bit for bit by hpet::fsb_hand_worked, legacy_hand_worked,
#   fsb_one_shot_bits, legacy_one_shot_bits, legacy_running_bits and
#   fsb_route_halves.
exclude_re = [
    "replace \\| with \\^ in (halted|quiet)",
    "replace \\| with \\^ in (lvt|dcr|dcr_log2)",
    "replace \\| with \\^ in level_one_shot",
    "replace \\| with \\^ in (fsb_route|fsb_one_shot|legacy_one_shot)",
    "hpet.rs:[0-9]+:21: replace \\| with \\^ in legacy_running",
]
