[package]
name = "optimal-kernel"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rust bindings for the Limine boot protocol (MIT OR Apache-2.0).
limine = "0.5"
# Frame allocator, zones and page-table logic, tested on the host.
optimal-mm = { path = "../crates/mm" }
# ACPI table parsing, tested on the host.
optimal-acpi = { path = "../crates/acpi" }
# Interrupt controller logic (APIC modes, register encodings, routing), tested on the host.
optimal-apic = { path = "../crates/apic" }

[features]
# Build the in-kernel test suite into the image (CI boots this build).
ktest = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = true
