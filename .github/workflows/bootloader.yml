name: Bootloader

# Optimal Boot, our own UEFI bootloader (see bootloader/DESIGN.md).
# Lints and runs the host test suite of the pure-logic core, including the
# seeded fuzz tests of every parser, in release mode so they cover more cases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy -p optimal-boot-core --all-targets -- -D warnings
          cargo clippy -p optimal-boot-core --target x86_64-unknown-uefi -- -D warnings

      - name: Core tests (debug, with overflow checks)
        run: cargo test -p optimal-boot-core

      - name: Core tests (release)
        run: cargo test -p optimal-boot-core --release

      # DESIGN.md item 8: 10^5 seeded cases per parser (signatures 10^4, each
      # signs and verifies), at release speed with overflow checks on.
      - name: Parser fuzzing (10^5 cases per parser)
        env:
          OPTIMAL_FUZZ_CASES: "100000"
        run: cargo test -p optimal-boot-core --profile fuzz fuzz

  loader:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Lint the loader, signing tool and conformance kernel
        run: |
          cargo build -q --release -p optimal-boot-sign
          target/release/optimal-boot-sign keygen /tmp/ci.secret /tmp/ci.pub
          cargo clippy -p optimal-boot-sign -- -D warnings
          OPTIMAL_BOOT_PUBKEYS=/tmp/ci.pub cargo clippy -p optimal-boot --target x86_64-unknown-uefi -- -D warnings
          cargo clippy -p optimal-boot-conformance --target x86_64-unknown-none -- -D warnings
          cargo clippy -p optimal-boot-quirk --target x86_64-unknown-uefi -- -D warnings

  # Every case boots the conformance kernel under Optimal Boot AND under
  # Limine (the reference): a check failing only under ours is our bug.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [r3, r4, r5, r6, pie, entry, la57, tpm, iommu-intel, iommu-amd, smp, smp-r3, smp-x2apic, big, small, tiny, headless, old-cpu, cd, usb, nvme, virtio,
               quirk-r3, quirk, quirk-x2apic, quirk-x2apic-mp, quirk-apic-off, quirk-iommu-intel, quirk-iommu-amd]
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install QEMU, OVMF, swtpm and image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf swtpm xorriso mtools dosfstools fdisk
          # KVM where the runner offers it (emulated cases force TCG).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Fetch Limine (BSD-2-Clause, reference loader for the differential runs)
        run: |
          git clone -q --depth 1 --branch v11.4.1-binary https://github.com/limine-bootloader/limine.git ../build/limine
          make -C ../build/limine >/dev/null

      - name: Conformance (${{ matrix.case }})
        run: scripts/conformance-case.sh ${{ matrix.case }}

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.case }}
          path: build/ob/*.log
          if-no-files-found: ignore

  # The firmware-quirk injector must refuse bad input rather than run a
  # weaker test, and every deliberate break of the loader's machine-state
  # code must be caught by a quirk case.
  quirk-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install QEMU, OVMF and image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf xorriso mtools dosfstools fdisk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Injector refusals
        run: scripts/quirk-refusals.sh

      - name: Loader mutants (each must be killed)
        run: scripts/loader-mutants.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quirk-tests
          path: build/ob/*.out
          if-no-files-found: ignore

  # Optimal Boot under OVMF's Secure Boot build with throwaway test keys:
  # the signed chain boots and its PCR 8/9 match a host replay; an unsigned,
  # wrongly signed, tampered or dbx-listed loader is refused by the firmware;
  # a tampered kernel, module or config, a foreign config key or a missing
  # signature is refused by the loader.
  secure-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install QEMU, OVMF, swtpm, signing and image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf swtpm sbsigntool python3-virt-firmware python3-pefile openssl xorriso mtools dosfstools fdisk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Secure Boot and tamper cases
        run: scripts/secureboot-case.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-boot
          path: build/ob/sb-*.log
          if-no-files-found: ignore
