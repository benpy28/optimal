name: Nightly soak

# Long, thorough test run: boots the kernel thousands of times across the full
# QEMU matrix to catch rare failures a single boot would miss. Runs every night
# at 1 AM Perth and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Boots per configuration"
        default: "40"
      tough_repeat:
        description: "Runs per tough-conditions scenario"
        default: "10"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM so QEMU runs at full speed
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU, xorriso and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf

      - name: Build kernel and ISOs
        run: ./scripts/build-iso.sh

      - name: In-kernel tests and crash tests
        run: ./scripts/kernel-tests.sh

      - name: Soak boot matrix
        env:
          REPEAT: ${{ inputs.repeat || '40' }}
        run: ./scripts/boot-test.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-failure-logs
          path: |
            build/boot-logs/
            build/test-logs/
          retention-days: 14

  # Optimal Boot parser fuzzing (DESIGN.md item 8): 10^8 seeded cases per
  # parser (signatures 10^7), with a new base seed every night so each run
  # covers new inputs. A failure prints the seed that reproduces it.
  bootloader-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bootloader
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in bootloader/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Parser fuzzing (10^8 cases per parser)
        env:
          OPTIMAL_FUZZ_CASES: "100000000"
          OPTIMAL_FUZZ_SEED: ${{ github.run_id }}
        run: |
          echo "base seed $OPTIMAL_FUZZ_SEED"
          cargo test -p optimal-boot-core --profile fuzz fuzz

  # Tough conditions (scripts/tough-test.sh), every scenario 10 times, on its
  # own runner so it runs alongside the boot soak.
  soak-tough:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM so QEMU runs at full speed
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU, firmware, signing and stress tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf \
            stress-ng sbsigntool mtools python3-virt-firmware

      - name: Build kernel, ISOs and Secure Boot images, fetch extra firmware
        env:
          STRICT: "1"
        run: |
          ./scripts/build-iso.sh
          ./scripts/secureboot.sh
          ./scripts/fetch-firmware.sh

      # The acpi-ram-* scenarios boot through it; without this step they all
      # failed with "injector not built" (nightly runs of 27 Nov).
      - name: Build the firmware-quirk injector (breaks ACPI tables in RAM)
        working-directory: bootloader
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release -p optimal-boot-quirk --target x86_64-unknown-uefi

      - name: Soak tough conditions
        env:
          REPEAT: ${{ inputs.tough_repeat || '10' }}
        run: ./scripts/tough-test.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-tough-failure-logs
          path: build/tough-logs/
          retention-days: 14
