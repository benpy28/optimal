[workspace]
resolver = "3"
members = ["crates/wtf8", "crates/html"]

[workspace.package]
edition = "2024"
repository = "https://github.com/benpy28/optimal"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 1
