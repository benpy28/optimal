# Mutants that cannot change behaviour, each with the reason. Everything else
# that survives fails the CI job.
exclude_re = [
    # position_of: when the queried offset equals the anchor, rescanning from
    # the buffer start gives the same answer as using the anchor. Equivalent.
    "replace < with <= in Input::position_of",
    # Script data escaped end tag open (13.2.5.24): sending a non-letter on
    # to the end tag name state instead gives the same output, because that
    # state's "anything else" also emits "</" plus the (empty) temporary
    # buffer and reconsumes in the escaped state. Equivalent. The line is in
    # the pattern so the other letter checks in Tokenizer::step stay tested;
    # if the line moves, this stops matching and CI says so.
    "tokenizer\\.rs:1294:22: replace match guard is_ascii_alpha\\(c\\) with true in Tokenizer::step",
    # Named character reference in an attribute, at the end of a chunk: the
    # wait for the next character is skipped when the name ends in ";",
    # because the historical rule only applies without one. Waiting anyway
    # (the mutant) re-matches the same name once more input comes and gives
    # the same tokens and errors; it only costs a second scan. Equivalent.
    # Line-pinned like the one above.
    "tokenizer\\.rs:2486:24: delete ! in Tokenizer::named_character_reference",
    # css parser, TokenList::push_run: `end` is below UNCLOSED (asserted just
    # above), so its top bit is clear and `^` sets it exactly as `|` does.
    # Equivalent. Line-pinned.
    "css/src/parser\\.rs:99:39: replace \\| with \\^ in TokenList<'a>::push_run",
    # css parser, has_curly_block_and_more: the value it checks has no
    # whitespace at either end (5.5.6 steps 4 and 7 removed it), so any
    # whitespace in it sits between two other values and `other` is set by
    # them anyway; counting whitespace as "other" (the mutant) changes no
    # result. Equivalent. Line-pinned.
    "css/src/parser\\.rs:632:17: delete match arm Token::Whitespace in Parser<'p, 'a, V>::has_curly_block_and_more",
]
